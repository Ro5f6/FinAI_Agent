[project]
name = "finai"
version = "0.1.0"
description = "Autonomous portfolio and investment research agent over SEC 10-K filings and live market data"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finai"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
