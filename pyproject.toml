[project]
name = "finai"
version = "0.1.0"
description = "Autonomous portfolio and investment research agent over SEC 10-K filings and live market data"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "edgartools>=5.60.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "tiktoken>=0.14.0",
    "voyageai>=0.5.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finai"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that call the live SEC API are deselected by default: they are slow,
# depend on the network, and EDGAR rate-limits. Run them with `-m network`.
addopts = "-m 'not network'"
markers = ["network: hits the live SEC EDGAR API"]
