# Local infrastructure for FinAI-Agent.
#
# No top-level `version:` key: it is obsolete in Compose v2 and later, and
# declaring it only produces a warning.
#
# Healthchecks for both services are added in 1.1.4.

services:
  # Vector store for 10-K chunks. Pinned to the newest v1 release, which
  # matches the qdrant-client minor used by the ingestion pipeline.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      # Bind mount, so the storage is visible locally. data/ is gitignored.
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped

  # Agent state for the LangGraph checkpointer. Redis 8 ships JSON and Search
  # in core, so this needs no module installation and no redis-stack image.
  redis:
    image: redis:8.10.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
